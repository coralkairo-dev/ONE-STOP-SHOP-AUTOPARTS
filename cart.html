<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moto-Xtreme | Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
     <style>
      html, body {
        height: 100%;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      main {
        flex: 1 0 auto;
      }
      
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-bicycle me-2"></i>Moto-Xtreme</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house-door-fill me-2"></i>Home</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown"><i class="bi bi-tags-fill me-2"></i>Products</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="products.html">All Products</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="category1.html">JVT</a></li>
                            <li><a class="dropdown-item" href="category2.html">RS8</a></li>
                        </ul>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="about.html"><i class="bi bi-info-circle-fill me-2"></i>About</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html"><i class="bi bi-envelope-fill me-2"></i>Contact</a></li>
                </ul>
                <div class="d-flex">
                    <a href="cart.html" class="btn btn-outline-light me-2">
                        <i class="bi bi-cart-fill me-2"></i>Cart (<span id="cart-count">0</span>)
                    </a>
           
    </nav>
    <main class="container my-5">
        <h1 class="text-center mb-5">Your Shopping Cart</h1>
        <div class="row">
            <div class="col-lg-8">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th colspan="2">Product</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody id="cart-table-body"></tbody>
                    </table>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Cart Summary</h5>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item d-flex justify-content-between"><span>Subtotal</span><span id="cart-subtotal">$0</span></li>
                            <li class="list-group-item d-flex justify-content-between"><span>Shipping</span><span id="cart-shipping">$250</span></li>
                            <li class="list-group-item d-flex justify-content-between"><strong>Total</strong><strong id="cart-total">$0</strong></li>
                        </ul>
                        <a href="#" class="btn btn-success w-100 mt-3">Proceed to Checkout</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer"><div class="container text-center"><span>&copy; 2025 Moto-Xtreme. All Rights Reserved.</span></div></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    function getCart() {
        return JSON.parse(localStorage.getItem('cartItems') || '[]');
    }
    function setCart(cart) {
        localStorage.setItem('cartItems', JSON.stringify(cart));
        document.getElementById('cart-count').textContent = cart.reduce((sum, item) => sum + item.qty, 0);
    }
    function renderCart() {
        let cart = getCart();
        setCart(cart);
        let tbody = document.getElementById('cart-table-body');
        tbody.innerHTML = '';
        let subtotal = 0;
        cart.forEach((item, idx) => {
            let total = item.price * item.qty;
            subtotal += total;
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td><img src="${item.image}" style="max-width: 100px;"></td>
                <td>${item.name}</td>
                <td>₱${item.price.toLocaleString()}</td>
                <td>
                    <input type="number" class="form-control cart-qty" data-idx="${idx}" value="${item.qty}" min="1" style="width: 70px;">
                    <button class="btn btn-sm btn-danger mt-2 remove-item" data-idx="${idx}"><i class="bi bi-trash"></i></button>
                </td>
                <td>₱${total.toLocaleString()}</td>
            `;
            tbody.appendChild(tr);
        });
        document.getElementById('cart-subtotal').textContent = `₱${subtotal.toLocaleString()}`;
        let shipping = cart.length > 0 ? 250 : 0;
        document.getElementById('cart-shipping').textContent = `₱${shipping}`;
        document.getElementById('cart-total').textContent = `₱${(subtotal + shipping).toLocaleString()}`;
    }
    document.addEventListener('DOMContentLoaded', function() {
        renderCart();

        document.getElementById('cart-table-body').addEventListener('input', function(e) {
            if (e.target.classList.contains('cart-qty')) {
                let idx = e.target.getAttribute('data-idx');
                let cart = getCart();
                let qty = parseInt(e.target.value);
                if (qty < 1) qty = 1;
                cart[idx].qty = qty;
                setCart(cart);
                renderCart();
            }
        });

        document.getElementById('cart-table-body').addEventListener('click', function(e) {
            if (e.target.closest('.remove-item')) {
                let idx = e.target.closest('.remove-item').getAttribute('data-idx');
                let cart = getCart();
                cart.splice(idx, 1);
                setCart(cart);
                renderCart();
            }
        });
    });
    </script>
</body>
</html>
